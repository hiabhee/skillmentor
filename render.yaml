# Render Blueprint: a public Next.js site, a private Flask API and PostgreSQL. See README "Deploying".
services:
  - type: web
    name: skillmentor-web
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: BACKEND_URL
        fromService:
          type: pserv
          name: skillmentor-api
          property: hostport
  - type: pserv
    name: skillmentor-api
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: flask --app backend.app db upgrade
    startCommand: gunicorn --chdir . backend.app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillmentor-db
          property: connectionString
      # The public address of skillmentor-web, e.g. https://skillmentor-web.onrender.com (comma-separate several).
      # The API rejects sign-ins and other changes from any other origin, so set it to the web service's real URL.
      - key: WEB_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ELEVAN_LAB_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
databases:
  - name: skillmentor-db
    databaseName: skillmentor
    user: skillmentor
    region: oregon
    plan: 0.5c-1g
    postgresMajorVersion: "16"
    ipAllowList: []
