# Render Blueprint for the Skillmentor API on Render's free plan.
# The website runs on Vercel and the database on Neon (free); see README "Deploying for free".
services:
  - type: web
    name: skillmentor-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    # Free instances can't run a pre-deploy step, so migrations run at start (they are idempotent).
    startCommand: flask --app backend.app db upgrade && gunicorn --chdir . backend.app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      # Copy this generated value into Vercel's API_PROXY_SECRET; the API refuses requests without it.
      - key: API_PROXY_SECRET
        generateValue: true
      # Neon connection string, e.g. postgresql://user:password@ep-xxx.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # The Vercel site's URL, e.g. https://skillmentor.vercel.app (comma-separate several).
      - key: WEB_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ELEVAN_LAB_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
